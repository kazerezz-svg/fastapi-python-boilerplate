name: Refresh Sleeper snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx==0.28.1
      - name: Refresh snapshot
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: python scripts/refresh_snapshot.py --api-base-url "$API_BASE_URL"
      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/latest.json
          git diff --cached --quiet || git commit -m "Refresh Sleeper snapshot"
          git push

